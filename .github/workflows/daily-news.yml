name: Daily Pharma News

on:
  schedule:
    # 08:10 KST Monday-Friday = 23:10 UTC Sunday-Thursday.
    # GitHub can delay or drop scheduled runs at the top of the hour.
    - cron: "10 23 * * 0-4"
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore SQLite cache
        uses: actions/cache@v5
        with:
          path: sent_news.db
          key: sent-news-db-${{ github.run_id }}
          restore-keys: |
            sent-news-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@dailypharmnews"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MAX_NEWS: "12"
          DB_PATH: sent_news.db
          LOG_DIR: logs
          TELEGRAM_RETRY_COUNT: "3"
          DAILYPHARM_ENABLED: "true"
          DAILYPHARM_LIMIT: "12"
          DAILYPHARM_PRIORITY_BONUS: "8"
          BOT_PAUSED: ${{ vars.BOT_PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          SKIP_KOREA_HOLIDAYS: ${{ vars.SKIP_KOREA_HOLIDAYS }}
          TRUSTED_RSS_INCLUDE_ALL: ${{ vars.TRUSTED_RSS_INCLUDE_ALL }}
          MAX_ARTICLE_AGE_DAYS: ${{ vars.MAX_ARTICLE_AGE_DAYS }}
        run: python main.py

      - name: Upload operation logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pharma-news-bot-runtime
          path: |
            logs/
            sent_news.db
          if-no-files-found: ignore
