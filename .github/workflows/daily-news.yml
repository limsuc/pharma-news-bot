name: Daily Pharma News

on:
  schedule:
    # 07:05 KST Monday-Friday = 22:05 UTC Sunday-Thursday.
    # The job waits until 09:00 KST if GitHub starts it early.
    - cron: "5 22 * * 0-4"
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Wait until 09:00 KST
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          now=$(TZ=Asia/Seoul date +%s)
          target=$(TZ=Asia/Seoul date -d 'today 09:00' +%s)
          if [ "$now" -lt "$target" ]; then
            sleep $((target - now))
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore SQLite cache
        uses: actions/cache@v5
        with:
          path: sent_news.db
          key: sent-news-db-${{ github.run_id }}
          restore-keys: |
            sent-news-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@dailypharmnews"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MAX_NEWS: "12"
          DB_PATH: sent_news.db
          LOG_DIR: logs
          TELEGRAM_RETRY_COUNT: "3"
          DAILYPHARM_ENABLED: "true"
          DAILYPHARM_LIMIT: "12"
          DAILYPHARM_PRIORITY_BONUS: "8"
          BOT_PAUSED: ${{ vars.BOT_PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          SKIP_KOREA_HOLIDAYS: ${{ vars.SKIP_KOREA_HOLIDAYS }}
          TRUSTED_RSS_INCLUDE_ALL: ${{ vars.TRUSTED_RSS_INCLUDE_ALL }}
          MAX_ARTICLE_AGE_DAYS: ${{ vars.MAX_ARTICLE_AGE_DAYS }}
        run: python main.py

      - name: Upload operation logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pharma-news-bot-runtime
          path: |
            logs/
            sent_news.db
          if-no-files-found: ignore
