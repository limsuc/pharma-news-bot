name: Keep scheduled workflows active

on:
  schedule:
    # Monthly heartbeat to prevent GitHub from disabling scheduled workflows
    # after 60 days of repository inactivity. Runs at 12:00 KST on the 1st.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update heartbeat
        run: |
          mkdir -p .github
          date -u +"Last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "No heartbeat changes to commit."
          else
            git commit -m "Keep scheduled workflows active"
            git push
          fi
